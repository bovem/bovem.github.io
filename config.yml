baseURL: "https://www.avni.sh"
title: "avni.sh"
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
publishDir: "docs"
# googleAnalytics: UA-123-45

pagination:
  pagerSize: 5

minify:
    disableXML: true
    # minifyOutput: true

languages:
    en:
        languageName: "English"
        weight: 1
        taxonomies:
          category: categories
          tag: tags
          series: series
        menu:
            main:
                - name: Archive
                  url: archives
                  weight: 5
                - name: Index
                  url: contents
                  weight: 10
                - name: Search
                  url: search/
                  weight: 30

outputs:
    home:
        - HTML
        - RSS
        - JSON

params:
    env: production # to enable google analytics, opengraph, twitter-cards and schema.
    description: "Hi, I'm Avnish. I’m a Software Engineer at Autodesk. I write articles on computer science and math."
    author: "Avnish Pal"
    # author: ["Me", "You"] # multiple authors

    defaultTheme: auto
    # disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: true
    # disableSpecial1stPost: true
    displayFullLangName: true
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: true
    ShowFullTextinRSS: true
    ShowRssButtonInSectionTermList: true
    ShowToc: true
    # comments: false
    images: ["cover.webp"]

    profileMode:
        enabled: false
        title: Avnish Pal
        imageUrl: "https://avatars.githubusercontent.com/u/29746858?v=4"
        imageTitle: Profile
        # imageWidth: 120
        # imageHeight: 120
        buttons:
            - name: Archives
              url: archives
            - name: Tags
              url: tags

    homeInfoParams:
        Title: "Hi, I'm Avnish"
        Content: |
           Building software at Autodesk in Singapore.

           Passionate about simplifying concepts from computer science and math.

           Check my <a target=_blank href="/resume/latest/Resume_Avnish_Pal.pdf">resume</a> to learn more about my professional experience.

           Subscribe to my <a target=_blank href="index.xml">RSS feed</a> to be notified when I publish new articles.
    socialIcons:
        - name: cv
          url: "resume/latest/Resume_Avnish_Pal.pdf"
        - name: email
          url: "mailto:work.mail@avni.sh"
        - name: github
          url: "https://github.com/bovem"
        - name: medium
          url: "https://bovem.medium.com/"
        - name: ycombinator
          url: "https://news.ycombinator.com/user?id=bovem"
        - name: linkedin
          url: "https://www.linkedin.com/in/avnish-pal"
        # - name: stackoverflow
        #   url: "https://stackoverflow.com/users/15039093/avnish-pal"
        - name: rss
          url: "index.xml"

    # editPost:
    #     URL: "https://github.com/bovem/bovem.github.io/pulls"
    #     Text: "Suggest Changes" # edit text
        # appendFilePath: true # to append file path to Edit link

    # label:
    #     text: "BOVEM"
    #     icon: icon.png
    #     iconHeight: 35

    # analytics:
    #     google:
    #         SiteVerificationTag: "XYZabc"

    assets:
        favicon: "/assets/favicon.ico"
        disableHLJS: true
    #     favicon16x16: "<link / abs url>"
    #     favicon32x32: "<link / abs url>"
    #     apple_touch_icon: "<link / abs url>"
    #     safari_pinned_tab: "<link / abs url>"

    # cover:
    #     hidden: true # hide everywhere but not in structured data
    #     hiddenInList: true # hide on list pages and home
    #     hiddenInSingle: true # hide on single page

    # fuseOpts:
    #     isCaseSensitive: false
    #     shouldSort: true
    #     location: 0
    #     distance: 1000
    #     threshold: 0.4
    #     minMatchCharLength: 0
    #     keys: ["title", "permalink", "summary", "content"]

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        # anchorLineNos: true
        codeFences: true
        guessSyntax: true
        lineNos: true
        # noClasses: false
        style: tokyonight-night

privacy:
    vimeo:
        disabled: false
        simple: true

    x:
        disabled: false
        enableDNT: true
        simple: true

    instagram:
        disabled: false
        simple: true

    youtube:
        disabled: false
        privacyEnhanced: true

services:
    instagram:
        disableInlineCSS: true
    x:
        disableInlineCSS: true
