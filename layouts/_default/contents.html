{{- define "main" }}

<header class="page-header">
  <h1>{{ .Title }}</h1>
  {{- if .Description }}
  <div class="post-description">
    {{ .Description }}
  </div>
  {{- end }}
</header>

<div class="post-content">
  {{- $postsSection := site.GetPage "posts" }}
  {{- with $postsSection }}
  <ul class="index-tree">
    {{- partial "contents-tree.html" (dict "page" . "depth" 1) }}
  </ul>
  {{- end }}
</div>

{{- end }}{{/* end main */}}
